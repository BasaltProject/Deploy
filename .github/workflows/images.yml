name: Images

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 26.3.1 (empty = latest stable release). Always rebuilds."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/images.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [server, proxy]
        include:
          - project: server
            repo: Server
          - project: proxy
            repo: Proxy
    concurrency:
      group: images-${{ matrix.project }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/basaltproject/${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: v
        env:
          REPO: ${{ matrix.repo }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/BasaltProject/${REPO}/releases/latest" --jq .tag_name)
          latest=${latest#v}
          version=${INPUT_VERSION:-$latest}
          version=${version#v}
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          gh api "repos/BasaltProject/${REPO}/releases/tags/v${version}" --jq .tag_name >/dev/null

          # Rebuild on manual runs and on changes to docker/**; the schedule only fills gaps.
          build=false
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            build=true
          elif ! docker manifest inspect "${IMAGE}:${version}" >/dev/null 2>&1; then
            build=true
          fi

          tags="${IMAGE}:${version}"
          if [ "$version" = "$latest" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          {
            echo "version=${version}"
            echo "build=${build}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version} latest=${latest} build=${build}"

      - name: Set up Buildx
        if: steps.v.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        if: steps.v.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/${{ matrix.project }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
